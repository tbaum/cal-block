appId: com.github.tbaum.cal-block
productName: cal-block
directories:
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: resources
    to: .
    filter:
      - "*.png"
asarUnpack:
  - "**/*.node"
npmRebuild: false
mac:
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.productivity
  identity: "-"
  hardenedRuntime: false
  extendInfo:
    LSUIElement: true
dmg:
  title: cal-block
